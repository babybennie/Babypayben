<script>

/* =========================================================
   BENNIE CHOCO ADMIN
   ========================================================= */


/*
    API หลักของระบบ
*/
const API = '/api';


/*
    ========================================================
    ADMIN TOKEN

    หน้า Admin ไม่ถามรหัสผ่านแล้ว

    URL ต้องเป็นรูปแบบ:

    /admin-TOKEN

    ตัวอย่าง:

    /admin-b7Kp92xLmQ4z

    Backend ต้องตรวจ Token ตัวเดียวกัน
    ========================================================
*/


function getAdminToken() {

    const path =
        window.location.pathname;


    /*
        รองรับ:

        /admin-xxxxx
    */

    const match =
        path.match(
            /^\/admin-([A-Za-z0-9_-]+)\/?$/
        );


    if (!match) {

        return '';

    }


    return match[1];

}


const ADMIN_TOKEN =
    getAdminToken();



/* =========================================================
   ตรวจว่ามี Admin Token หรือไม่
========================================================= */

if (!ADMIN_TOKEN) {

    document.getElementById(
        'adminPanel'
    ).innerHTML = `

        <div
            class="glass
                   rounded-3xl
                   p-8
                   max-w-md
                   mx-auto
                   text-center"
        >

            <div class="text-5xl mb-4">
                🔒
            </div>

            <h2
                class="text-xl
                       font-bold
                       mb-2"
            >
                ไม่พบลิงก์ Admin
            </h2>

            <p
                class="text-sm
                       text-gray-500"
            >
                กรุณาเปิดลิงก์ Admin ที่ถูกต้อง
            </p>

        </div>

    `;

}


/* =========================================================
   API FETCH
========================================================= */

async function apiFetch(
    url,
    options = {}
) {

    if (!ADMIN_TOKEN) {

        throw new Error(
            'ไม่พบ Admin Token'
        );

    }


    const headers = {

        ...(options.headers || {}),

        /*
            Backend ต้องรองรับ Header นี้
        */
        'X-Admin-Token':
            ADMIN_TOKEN

    };


    /*
        JSON body
    */

    if (options.body) {

        headers['Content-Type'] =
            'application/json';

    }


    const response =
        await fetch(
            url,
            {
                ...options,
                headers
            }
        );


    /*
        ถ้าไม่มีสิทธิ์
    */

    if (
        response.status === 401 ||
        response.status === 403
    ) {

        throw new Error(
            'ไม่มีสิทธิ์เข้าใช้งาน Admin'
        );

    }


    /*
        อ่าน JSON
    */

    const data =
        await response
            .json()
            .catch(
                () => ({})
            );


    if (!response.ok) {

        throw new Error(
            data.error ||
            data.message ||
            'เกิดข้อผิดพลาดจากระบบ'
        );

    }


    return data;

}


/* =========================================================
   LOAD PAYMENTS
========================================================= */

async function loadPayments() {

    const filter =
        document.getElementById(
            'statusFilter'
        );


    const status =
        filter
            ? filter.value
            : '';


    let url =
        `${API}/admin/payments?limit=100`;


    if (status) {

        url +=
            `&status=${encodeURIComponent(status)}`;

    }


    const table =
        document.getElementById(
            'paymentTable'
        );


    table.innerHTML = `

        <tr>

            <td
                colspan="6"
                class="p-8
                       text-center
                       text-gray-400"
            >
                กำลังโหลด...
            </td>

        </tr>

    `;


    try {

        const result =
            await apiFetch(
                url
            );


        renderPayments(
            result.payments || []
        );


    } catch (error) {

        console.error(
            'loadPayments error:',
            error
        );


        table.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="p-8
                           text-center
                           text-red-400"
                >
                    ${escapeHtml(error.message)}
                </td>

            </tr>

        `;

    }

}


/* =========================================================
   RENDER PAYMENTS
========================================================= */

function renderPayments(
    payments
) {

    const table =
        document.getElementById(
            'paymentTable'
        );


    if (!payments.length) {

        table.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="p-8
                           text-center
                           text-gray-400"
                >
                    ไม่พบรายการชำระเงิน
                </td>

            </tr>

        `;

        return;

    }


    table.innerHTML =
        payments
            .map(
                paymentRow
            )
            .join('');

}


/* =========================================================
   PAYMENT ROW
========================================================= */

function paymentRow(
    payment
) {

    const status =
        payment.status;


    let statusText =
        status || '-';


    let statusClass =
        'bg-gray-100 text-gray-600';


    if (
        status === 'pending'
    ) {

        statusText =
            'รอชำระ';

        statusClass =
            'bg-yellow-100 text-yellow-700';

    }


    if (
        status === 'paid'
    ) {

        statusText =
            'ชำระแล้ว';

        statusClass =
            'bg-green-100 text-green-700';

    }


    if (
        status === 'cancelled'
    ) {

        statusText =
            'ยกเลิก';

        statusClass =
            'bg-red-100 text-red-700';

    }


    if (
        status === 'expired'
    ) {

        statusText =
            'หมดอายุ';

        statusClass =
            'bg-gray-100 text-gray-500';

    }


    const paymentId =
        payment.id || '';


    const customerUrl =
        `/pay/${encodeURIComponent(paymentId)}`;


    return `

        <tr
            class="border-t
                   border-pink-50
                   hover:bg-pink-50/40"
        >


            <!-- ID -->

            <td class="p-4">

                <div
                    class="font-bold
                           text-pink-500"
                >
                    ${escapeHtml(paymentId)}
                </div>


                <a
                    href="${customerUrl}"
                    target="_blank"
                    rel="noopener"
                    class="text-xs
                           text-gray-400
                           underline"
                >
                    เปิดหน้าลูกค้า
                </a>

            </td>



            <!-- CUSTOMER -->

            <td class="p-4">

                <div class="font-medium">

                    ${escapeHtml(
                        payment.customer_name ||
                        '-'
                    )}

                </div>


                <div
                    class="text-xs
                           text-gray-400"
                >

                    ${escapeHtml(
                        payment.order_detail ||
                        '-'
                    )}

                </div>

            </td>



            <!-- AMOUNT -->

            <td class="p-4 font-bold">

                ฿${Number(
                    payment.amount || 0
                ).toLocaleString(
                    'th-TH',
                    {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }
                )}

            </td>



            <!-- STATUS -->

            <td class="p-4">

                <span
                    class="inline-block
                           px-3 py-1
                           rounded-full
                           text-xs
                           font-medium
                           ${statusClass}"
                >
                    ${statusText}
                </span>

            </td>



            <!-- EXPIRE -->

            <td class="p-4 text-xs">

                ${formatDate(
                    payment.expires_at
                )}

            </td>



            <!-- ACTIONS -->

            <td class="p-4">

                <div
                    class="flex
                           justify-end
                           gap-2
                           flex-wrap"
                >


                    ${
                        status === 'pending'
                        ? `

                            <button
                                onclick="markPaid('${escapeJs(paymentId)}')"
                                class="bg-green-500
                                       hover:bg-green-600
                                       text-white
                                       px-3 py-1.5
                                       rounded-lg
                                       text-xs"
                            >
                                จ่ายแล้ว
                            </button>


                            <button
                                onclick="cancelPayment('${escapeJs(paymentId)}')"
                                class="bg-red-500
                                       hover:bg-red-600
                                       text-white
                                       px-3 py-1.5
                                       rounded-lg
                                       text-xs"
                            >
                                ยกเลิก
                            </button>

                        `
                        : ''
                    }


                    <button
                        onclick="openEdit('${escapeJs(paymentId)}')"
                        class="bg-pink-500
                               hover:bg-pink-600
                               text-white
                               px-3 py-1.5
                               rounded-lg
                               text-xs"
                    >
                        แก้ไข
                    </button>


                </div>

            </td>


        </tr>

    `;

}


/* =========================================================
   CREATE PAYMENT
========================================================= */

async function createPayment() {

    const amount =
        document
            .getElementById(
                'createAmount'
            )
            .value;


    const customerName =
        document
            .getElementById(
                'createCustomer'
            )
            .value
            .trim();


    const orderDetail =
        document
            .getElementById(
                'createOrder'
            )
            .value
            .trim();


    const expiresInMinutes =
        document
            .getElementById(
                'createExpire'
            )
            .value;


    const numericAmount =
        Number(amount);


    const numericExpire =
        Number(
            expiresInMinutes
        );


    if (
        !Number.isFinite(
            numericAmount
        ) ||
        numericAmount <= 0
    ) {

        alert(
            'กรุณาใส่ยอดเงินให้ถูกต้อง'
        );

        return;

    }


    if (
        !Number.isInteger(
            numericExpire
        ) ||
        numericExpire < 5 ||
        numericExpire > 10080
    ) {

        alert(
            'อายุลิงก์ต้องอยู่ระหว่าง 5 - 10080 นาที'
        );

        return;

    }


    const button =
        document.getElementById(
            'createButton'
        );


    button.disabled = true;

    button.textContent =
        'กำลังสร้าง...';


    try {

        const result =
            await apiFetch(
                `${API}/admin/payments`,
                {
                    method: 'POST',

                    body:
                        JSON.stringify({

                            amount:
                                numericAmount,

                            customerName,

                            orderDetail,

                            expiresInMinutes:
                                numericExpire

                        })

                }
            );


        const payment =
            result.payment;


        if (
            !payment ||
            !payment.id
        ) {

            throw new Error(
                'ระบบสร้างรายการแล้ว แต่ไม่พบ Payment ID'
            );

        }


        const customerUrl =
            `${location.origin}/pay/${encodeURIComponent(payment.id)}`;


        const resultBox =
            document.getElementById(
                'createResult'
            );


        resultBox.innerHTML = `

            <div
                class="font-bold
                       text-pink-500
                       mb-2"
            >
                ✓ สร้างรายการสำเร็จ
            </div>


            <div class="text-sm mb-2">

                Payment ID:

                <b>
                    ${escapeHtml(payment.id)}
                </b>

            </div>


            <div
                class="text-xs
                       text-gray-500
                       mb-1"
            >
                ลิงก์สำหรับลูกค้า
            </div>


            <div class="flex gap-2">

                <input
                    id="generatedPaymentUrl"
                    value="${escapeHtml(customerUrl)}"
                    readonly
                    class="flex-1
                           border
                           rounded-xl
                           px-3 py-2
                           text-xs"
                >


                <button
                    onclick="copyGeneratedUrl()"
                    class="bg-pink-500
                           hover:bg-pink-600
                           text-white
                           px-4
                           rounded-xl"
                >
                    คัดลอก
                </button>

            </div>


            <a
                href="${escapeHtml(customerUrl)}"
                target="_blank"
                rel="noopener"
                class="inline-block
                       mt-3
                       text-sm
                       text-pink-500
                       underline"
            >
                เปิดหน้าลูกค้า
            </a>

        `;


        resultBox.classList.remove(
            'hidden'
        );


        document
            .getElementById(
                'createAmount'
            )
            .value = '';


        document
            .getElementById(
                'createCustomer'
            )
            .value = '';


        document
            .getElementById(
                'createOrder'
            )
            .value = '';


        await loadPayments();


    } catch (error) {

        console.error(
            'createPayment error:',
            error
        );


        alert(
            error.message
        );

    } finally {

        button.disabled = false;

        button.textContent =
            '+ สร้างรายการ';

    }

}


/* =========================================================
   MARK PAID
========================================================= */

async function markPaid(
    id
) {

    if (
        !confirm(
            `ยืนยันว่า ${id} ได้รับเงินแล้ว?`
        )
    ) {

        return;

    }


    try {

        await apiFetch(
            `${API}/admin/payments/${encodeURIComponent(id)}/paid`,
            {
                method: 'PATCH'
            }
        );


        await loadPayments();


    } catch (error) {

        alert(
            error.message
        );

    }

}


/* =========================================================
   CANCEL PAYMENT
========================================================= */

async function cancelPayment(
    id
) {

    if (
        !confirm(
            `ยืนยันยกเลิก ${id}?`
        )
    ) {

        return;

    }


    try {

        await apiFetch(
            `${API}/admin/payments/${encodeURIComponent(id)}/cancel`,
            {
                method: 'PATCH'
            }
        );


        await loadPayments();


    } catch (error) {

        alert(
            error.message
        );

    }

}


/* =========================================================
   OPEN EDIT
========================================================= */

async function openEdit(
    id
) {

    try {

        const result =
            await apiFetch(
                `${API}/admin/payments/${encodeURIComponent(id)}`
            );


        const payment =
            result.payment;


        if (!payment) {

            throw new Error(
                'ไม่พบรายการนี้'
            );

        }


        document
            .getElementById(
                'editId'
            )
            .value =
            payment.id || '';


        document
            .getElementById(
                'editAmount'
            )
            .value =
            payment.amount || '';


        document
            .getElementById(
                'editCustomer'
            )
            .value =
            payment.customer_name || '';


        document
            .getElementById(
                'editOrder'
            )
            .value =
            payment.order_detail || '';


        const modal =
            document.getElementById(
                'editModal'
            );


        modal.classList.remove(
            'hidden'
        );


        modal.classList.add(
            'flex'
        );


    } catch (error) {

        alert(
            error.message
        );

    }

}


/* =========================================================
   CLOSE EDIT
========================================================= */

function closeEdit() {

    const modal =
        document.getElementById(
            'editModal'
        );


    modal.classList.add(
        'hidden'
    );


    modal.classList.remove(
        'flex'
    );

}


/* =========================================================
   SAVE EDIT
========================================================= */

async function saveEdit() {

    const id =
        document
            .getElementById(
                'editId'
            )
            .value;


    const amount =
        Number(
            document
                .getElementById(
                    'editAmount'
                )
                .value
        );


    const customerName =
        document
            .getElementById(
                'editCustomer'
            )
            .value
            .trim();


    const orderDetail =
        document
            .getElementById(
                'editOrder'
            )
            .value
            .trim();


    if (!id) {

        alert(
            'ไม่พบ Payment ID'
        );

        return;

    }


    if (
        !Number.isFinite(amount) ||
        amount <= 0
    ) {

        alert(
            'กรุณาระบุยอดเงินให้ถูกต้อง'
        );

        return;

    }


    try {

        await apiFetch(
            `${API}/admin/payments/${encodeURIComponent(id)}`,
            {
                method: 'PATCH',

                body:
                    JSON.stringify({

                        amount,

                        customerName,

                        orderDetail

                    })

            }
        );


        closeEdit();


        await loadPayments();


    } catch (error) {

        alert(
            error.message
        );

    }

}


/* =========================================================
   COPY GENERATED URL
========================================================= */

async function copyGeneratedUrl() {

    const input =
        document.getElementById(
            'generatedPaymentUrl'
        );


    if (!input) {

        return;

    }


    try {

        await copyValue(
            input.value
        );


    } catch (error) {

        alert(
            'ไม่สามารถคัดลอกได้'
        );

    }

}


/* =========================================================
   COPY
========================================================= */

async function copyValue(
    value
) {

    try {

        if (
            navigator.clipboard &&
            window.isSecureContext
        ) {

            await navigator.clipboard.writeText(
                value
            );

        } else {

            const textarea =
                document.createElement(
                    'textarea'
                );


            textarea.value =
                value;


            textarea.style.position =
                'fixed';


            textarea.style.opacity =
                '0';


            document.body.appendChild(
                textarea
            );


            textarea.focus();


            textarea.select();


            document.execCommand(
                'copy'
            );


            textarea.remove();

        }


        alert(
            'คัดลอกลิงก์แล้ว'
        );


    } catch (error) {

        console.error(
            'copy error:',
            error
        );


        throw error;

    }

}


/* =========================================================
   DATE
========================================================= */

function formatDate(
    value
) {

    if (!value) {

        return '-';

    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return '-';

    }


    return date.toLocaleString(
        'th-TH',
        {
            dateStyle: 'short',
            timeStyle: 'short'
        }
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    value
) {

    return String(
        value ?? ''
    )

        .replace(
            /&/g,
            '&amp;'
        )

        .replace(
            /</g,
            '&lt;'
        )

        .replace(
            />/g,
            '&gt;'
        )

        .replace(
            /"/g,
            '&quot;'
        )

        .replace(
            /'/g,
            '&#039;'
        );

}


/* =========================================================
   ESCAPE JS
========================================================= */

function escapeJs(
    value
) {

    return String(
        value ?? ''
    )

        .replace(
            /\\/g,
            '\\\\'
        )

        .replace(
            /'/g,
            "\\'"
        )

        .replace(
            /"/g,
            '\\"'
        )

        .replace(
            /\r/g,
            '\\r'
        )

        .replace(
            /\n/g,
            '\\n'
        );

}


/* =========================================================
   LOGOUT
========================================================= */

function logout() {

    /*
        ไม่มีรหัสให้ล้างแล้ว

        เพียงออกจากหน้า Admin
    */

    window.location.href = '/';

}
