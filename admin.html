<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bennie Choco Admin</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        body {
            font-family: 'Prompt', sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #fff9fb 0%,
                    #fcecf2 100%
                );

            min-height: 100vh;
        }

        .glass {
            background: rgba(255,255,255,.88);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            border: 1px solid rgba(255,255,255,.95);

            box-shadow:
                0 20px 50px -10px
                rgba(244,114,182,.15);
        }

        input,
        select {
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #f9a8d4;
            box-shadow: 0 0 0 3px rgba(244,114,182,.12);
        }

        button {
            transition: .15s ease;
        }

        button:active {
            transform: scale(.98);
        }
    </style>
</head>

<body class="text-gray-700">

<div class="max-w-6xl mx-auto px-4 py-6">

    <!-- HEADER -->
    <div
        class="flex flex-col md:flex-row
               md:items-center md:justify-between
               gap-4 mb-6"
    >

        <div>
            <h1 class="text-2xl font-bold text-pink-500">
                Bennie Choco Admin
            </h1>

            <p class="text-sm text-gray-500">
                ระบบจัดการรายการชำระเงิน
            </p>
        </div>

        <button
            id="logoutButton"
            onclick="logout()"
            class="hidden bg-gray-800
                   hover:bg-gray-900
                   text-white
                   px-5 py-2.5
                   rounded-xl
                   text-sm
                   font-medium"
        >
            ออกจากระบบ
        </button>

    </div>


    <!-- LOGIN -->
    <div
        id="loginPanel"
        class="max-w-md mx-auto glass
               rounded-3xl p-6"
    >

        <div class="text-center mb-6">

            <div
                class="w-16 h-16
                       mx-auto mb-4
                       rounded-2xl
                       bg-pink-100
                       flex items-center
                       justify-center
                       text-2xl"
            >
                🍫
            </div>

            <h2 class="text-xl font-bold">
                Bennie Choco
            </h2>

            <p class="text-sm text-gray-500 mt-1">
                เข้าสู่ระบบแอดมิน
            </p>

        </div>


        <label class="text-sm font-medium">
            รหัสแอดมิน
        </label>

        <input
            id="apiKeyInput"
            type="password"
            placeholder="กรุณาใส่รหัสแอดมิน"
            autocomplete="current-password"
            class="w-full
                   mt-2
                   border border-pink-100
                   rounded-xl
                   px-4 py-3
                   outline-none"
            onkeydown="if(event.key === 'Enter') login()"
        >


        <button
            onclick="login()"
            class="w-full mt-4
                   bg-pink-500
                   hover:bg-pink-600
                   text-white
                   font-semibold
                   py-3
                   rounded-xl"
        >
            เข้าสู่ระบบ
        </button>


        <div
            id="loginError"
            class="text-red-500
                   text-sm
                   mt-3
                   hidden"
        >
        </div>

    </div>


    <!-- ADMIN APP -->
    <div
        id="adminPanel"
        class="hidden"
    >

        <!-- CREATE PAYMENT -->
        <div class="glass rounded-3xl p-6 mb-6">

            <div class="mb-5">

                <h2 class="text-lg font-bold">
                    สร้างรายการชำระเงิน
                </h2>

                <p class="text-xs text-gray-500">
                    สร้างลิงก์สำหรับส่งให้ลูกค้า
                </p>

            </div>


            <div class="grid md:grid-cols-2 gap-4">

                <!-- AMOUNT -->
                <div>

                    <label class="text-sm font-medium">
                        ยอดเงิน
                    </label>

                    <input
                        id="createAmount"
                        type="number"
                        min="0.01"
                        step="0.01"
                        placeholder="599"
                        class="mt-1 w-full
                               border border-pink-100
                               rounded-xl
                               px-4 py-3"
                    >

                </div>


                <!-- CUSTOMER -->
                <div>

                    <label class="text-sm font-medium">
                        ชื่อลูกค้า
                    </label>

                    <input
                        id="createCustomer"
                        type="text"
                        placeholder="น้องพลอย"
                        class="mt-1 w-full
                               border border-pink-100
                               rounded-xl
                               px-4 py-3"
                    >

                </div>


                <!-- ORDER -->
                <div>

                    <label class="text-sm font-medium">
                        รายละเอียดออเดอร์
                    </label>

                    <input
                        id="createOrder"
                        type="text"
                        placeholder="ค่ามัดจำสินค้า"
                        class="mt-1 w-full
                               border border-pink-100
                               rounded-xl
                               px-4 py-3"
                    >

                </div>


                <!-- EXPIRE -->
                <div>

                    <label class="text-sm font-medium">
                        อายุลิงก์ (นาที)
                    </label>

                    <input
                        id="createExpire"
                        type="number"
                        value="60"
                        min="5"
                        max="10080"
                        class="mt-1 w-full
                               border border-pink-100
                               rounded-xl
                               px-4 py-3"
                    >

                </div>

            </div>


            <button
                onclick="createPayment()"
                class="mt-5
                       bg-pink-500
                       hover:bg-pink-600
                       text-white
                       font-semibold
                       px-6 py-3
                       rounded-xl"
            >
                + สร้างรายการ
            </button>


            <!-- CREATE RESULT -->
            <div
                id="createResult"
                class="hidden mt-5
                       bg-pink-50
                       border border-pink-200
                       rounded-2xl
                       p-4"
            >
            </div>

        </div>


        <!-- FILTER -->
        <div class="glass rounded-3xl p-5 mb-6">

            <div
                class="flex flex-col md:flex-row
                       md:items-center
                       md:justify-between
                       gap-3"
            >

                <div>

                    <h2 class="font-bold">
                        รายการชำระเงิน
                    </h2>

                    <p class="text-xs text-gray-500 mt-1">
                        ดูและจัดการรายการของ Bennie Choco
                    </p>

                </div>


                <div class="flex gap-2">

                    <select
                        id="statusFilter"
                        onchange="loadPayments()"
                        class="border border-pink-100
                               rounded-xl
                               px-4 py-2"
                    >

                        <option value="">
                            ทั้งหมด
                        </option>

                        <option value="pending">
                            รอชำระ
                        </option>

                        <option value="paid">
                            ชำระแล้ว
                        </option>

                        <option value="cancelled">
                            ยกเลิก
                        </option>

                        <option value="expired">
                            หมดอายุ
                        </option>

                    </select>


                    <button
                        onclick="loadPayments()"
                        class="bg-gray-800
                               hover:bg-gray-900
                               text-white
                               px-4 py-2
                               rounded-xl"
                    >
                        รีเฟรช
                    </button>

                </div>

            </div>

        </div>


        <!-- TABLE -->
        <div
            class="glass rounded-3xl
                   overflow-hidden"
        >

            <div class="overflow-x-auto">

                <table class="w-full text-sm">

                    <thead class="bg-pink-50">

                        <tr>

                            <th class="text-left p-4">
                                Payment ID
                            </th>

                            <th class="text-left p-4">
                                ลูกค้า
                            </th>

                            <th class="text-left p-4">
                                ยอด
                            </th>

                            <th class="text-left p-4">
                                สถานะ
                            </th>

                            <th class="text-left p-4">
                                หมดอายุ
                            </th>

                            <th class="text-right p-4">
                                จัดการ
                            </th>

                        </tr>

                    </thead>


                    <tbody id="paymentTable">

                        <tr>

                            <td
                                colspan="6"
                                class="p-8
                                       text-center
                                       text-gray-400"
                            >
                                กรุณาเข้าสู่ระบบ
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<!-- EDIT MODAL -->
<div
    id="editModal"
    class="fixed inset-0
           bg-black/40
           hidden
           items-center
           justify-center
           p-4
           z-50"
>

    <div
        class="bg-white
               rounded-3xl
               max-w-lg
               w-full
               p-6"
    >

        <div
            class="flex justify-between
                   items-center
                   mb-5"
        >

            <h2 class="font-bold text-lg">
                แก้ไขรายการ
            </h2>

            <button
                onclick="closeEdit()"
                class="text-gray-400
                       hover:text-gray-700
                       text-2xl"
            >
                ×
            </button>

        </div>


        <input
            id="editId"
            type="hidden"
        >


        <label class="text-sm">
            ยอดเงิน
        </label>

        <input
            id="editAmount"
            type="number"
            min="0.01"
            step="0.01"
            class="w-full
                   border
                   rounded-xl
                   px-4 py-3
                   mt-1 mb-4"
        >


        <label class="text-sm">
            ชื่อลูกค้า
        </label>

        <input
            id="editCustomer"
            type="text"
            class="w-full
                   border
                   rounded-xl
                   px-4 py-3
                   mt-1 mb-4"
        >


        <label class="text-sm">
            รายละเอียด
        </label>

        <input
            id="editOrder"
            type="text"
            class="w-full
                   border
                   rounded-xl
                   px-4 py-3
                   mt-1 mb-5"
        >


        <div class="flex gap-2">

            <button
                onclick="saveEdit()"
                class="flex-1
                       bg-pink-500
                       hover:bg-pink-600
                       text-white
                       py-3
                       rounded-xl
                       font-semibold"
            >
                บันทึก
            </button>


            <button
                onclick="closeEdit()"
                class="px-5
                       bg-gray-100
                       hover:bg-gray-200
                       rounded-xl"
            >
                ยกเลิก
            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   BENNIE CHOCO CONFIG
   ===================================================== */

/*
   ชื่อร้าน
*/
const STORE_NAME = 'Bennie Choco';


/*
   รหัสแอดมิน

   ใช้ตัวพิมพ์เล็กตามที่กำหนด:
   benzzappy1
*/
const ADMIN_API_KEY = 'benzzappy1';


/*
   API ของระบบ

   ใช้ /api เพื่อให้หน้า Admin
   คุยกับ Backend เดิม
*/
const API = '/api';


/*
   ชื่อที่ใช้เก็บ API Key ในเครื่อง

   เปลี่ยนจากชื่อเก่า
   pinkjulie_admin_key
   เป็นของ Bennie Choco
*/
const STORAGE_KEY = 'bennie_choco_admin_key';


/*
   API Key ปัจจุบัน
*/
let API_KEY =
    localStorage.getItem(STORAGE_KEY);


/* =====================================================
   LOGIN
   ===================================================== */

function login() {

    const input =
        document.getElementById(
            'apiKeyInput'
        );


    const key =
        input.value.trim();


    /*
       ล้าง error เก่า
    */
    hideLoginError();


    if (!key) {

        showLoginError(
            'กรุณาใส่รหัสแอดมิน'
        );

        return;
    }


    /*
       ตรวจรหัสหน้าเว็บก่อน
    */
    if (key !== ADMIN_API_KEY) {

        showLoginError(
            'รหัสแอดมินไม่ถูกต้อง'
        );

        input.select();

        return;
    }


    /*
       เก็บรหัสไว้ใช้
    */
    API_KEY = key;


    localStorage.setItem(
        STORAGE_KEY,
        key
    );


    /*
       ตรวจสอบกับ Backend จริง
    */
    verifyLogin();
}


/* =====================================================
   VERIFY LOGIN
   ===================================================== */

async function verifyLogin() {

    if (!API_KEY) {

        return;

    }


    try {

        const response =
            await fetch(
                `${API}/admin/payments?limit=1`,
                {
                    method: 'GET',

                    headers: {
                        'X-API-Key': API_KEY
                    }
                }
            );


        /*
           ถ้า Backend ไม่ยอมรับรหัส
        */
        if (!response.ok) {

            let errorMessage =
                'รหัสแอดมินไม่สามารถใช้งานกับระบบได้';


            try {

                const data =
                    await response.json();

                if (data.error) {

                    errorMessage =
                        data.error;

                }

            } catch (e) {
                // ไม่ต้องทำอะไร
            }


            clearLogin();


            showLoginError(
                errorMessage
            );


            return;
        }


        /*
           Login สำเร็จ
        */
        document
            .getElementById('loginPanel')
            .classList.add('hidden');


        document
            .getElementById('adminPanel')
            .classList.remove('hidden');


        document
            .getElementById('logoutButton')
            .classList.remove('hidden');


        hideLoginError();


        /*
           โหลดรายการ
        */
        loadPayments();


    } catch (error) {

        console.error(
            'verifyLogin error:',
            error
        );


        clearLogin();


        showLoginError(
            'เชื่อมต่อระบบไม่ได้ กรุณาตรวจสอบว่า API/Backend ทำงานอยู่'
        );

    }
}


/* =====================================================
   CLEAR LOGIN
   ===================================================== */

function clearLogin() {

    localStorage.removeItem(
        STORAGE_KEY
    );

    API_KEY = null;

}


/* =====================================================
   LOGIN ERROR
   ===================================================== */

function showLoginError(
    message
) {

    const el =
        document.getElementById(
            'loginError'
        );


    el.textContent =
        message;


    el.classList.remove(
        'hidden'
    );
}


function hideLoginError() {

    const el =
        document.getElementById(
            'loginError'
        );


    el.textContent =
        '';


    el.classList.add(
        'hidden'
    );
}


/* =====================================================
   LOGOUT
   ===================================================== */

function logout() {

    clearLogin();


    location.reload();

}


/* =====================================================
   FETCH HELPER
   ===================================================== */

async function apiFetch(
    url,
    options = {}
) {

    if (!API_KEY) {

        throw new Error(
            'กรุณาเข้าสู่ระบบก่อน'
        );

    }


    const headers = {

        ...(options.headers || {}),

        'X-API-Key':
            API_KEY

    };


    /*
       ใส่ Content-Type เฉพาะเวลามี body
    */
    if (options.body) {

        headers['Content-Type'] =
            'application/json';

    }


    const response =
        await fetch(
            url,
            {
                ...options,
                headers
            }
        );


    /*
       ไม่มีสิทธิ์
    */
    if (
        response.status === 401 ||
        response.status === 403
    ) {

        clearLogin();

        location.reload();

        throw new Error(
            'รหัสแอดมินไม่ถูกต้องหรือหมดสิทธิ์'
        );

    }


    /*
       อ่านข้อมูลตอบกลับ
    */
    const data =
        await response
            .json()
            .catch(
                () => ({})
            );


    if (!response.ok) {

        throw new Error(
            data.error ||
            data.message ||
            'เกิดข้อผิดพลาดจากระบบ'
        );

    }


    return data;
}


/* =====================================================
   CREATE PAYMENT
   ===================================================== */

async function createPayment() {

    const amount =
        document
            .getElementById(
                'createAmount'
            )
            .value;


    const customerName =
        document
            .getElementById(
                'createCustomer'
            )
            .value
            .trim();


    const orderDetail =
        document
            .getElementById(
                'createOrder'
            )
            .value
            .trim();


    const expiresInMinutes =
        document
            .getElementById(
                'createExpire'
            )
            .value;


    const numericAmount =
        Number(amount);


    const numericExpire =
        Number(
            expiresInMinutes
        );


    /*
       ตรวจยอด
    */
    if (
        !amount ||
        !Number.isFinite(numericAmount) ||
        numericAmount <= 0
    ) {

        alert(
            'กรุณาใส่ยอดเงินให้ถูกต้อง'
        );

        return;
    }


    /*
       ตรวจอายุลิงก์
    */
    if (
        !Number.isFinite(numericExpire) ||
        numericExpire < 5 ||
        numericExpire > 10080
    ) {

        alert(
            'อายุลิงก์ต้องอยู่ระหว่าง 5 - 10080 นาที'
        );

        return;
    }


    try {

        const result =
            await apiFetch(
                `${API}/admin/payments`,
                {
                    method: 'POST',

                    body:
                        JSON.stringify({

                            amount:
                                numericAmount,

                            customerName,

                            orderDetail,

                            expiresInMinutes:
                                numericExpire

                        })
                }
            );


        const payment =
            result.payment;


        if (
            !payment ||
            !payment.id
        ) {

            throw new Error(
                'ระบบสร้างรายการแล้ว แต่ไม่พบ Payment ID'
            );

        }


        /*
           ลิงก์ลูกค้า
        */
        const customerUrl =
            `${location.origin}/pay/${encodeURIComponent(payment.id)}`;


        const resultBox =
            document.getElementById(
                'createResult'
            );


        resultBox.innerHTML = `

            <div
                class="font-bold
                       text-pink-500
                       mb-2"
            >
                ✓ สร้างรายการสำเร็จ
            </div>


            <div class="text-sm mb-2">

                Payment ID:

                <b>
                    ${escapeHtml(payment.id)}
                </b>

            </div>


            <div
                class="text-xs
                       text-gray-500
                       mb-1"
            >
                ลิงก์สำหรับลูกค้า
            </div>


            <div class="flex gap-2">

                <input
                    value="${escapeHtml(customerUrl)}"
                    readonly
                    class="flex-1
                           border
                           rounded-xl
                           px-3 py-2
                           text-xs"
                >


                <button
                    onclick="copyValue('${escapeJs(customerUrl)}')"
                    class="bg-pink-500
                           hover:bg-pink-600
                           text-white
                           px-4
                           rounded-xl"
                >
                    คัดลอก
                </button>

            </div>


            <a
                href="${escapeHtml(customerUrl)}"
                target="_blank"
                rel="noopener"
                class="inline-block
                       mt-3
                       text-sm
                       text-pink-500
                       underline"
            >
                เปิดหน้าลูกค้า
            </a>

        `;


        resultBox.classList.remove(
            'hidden'
        );


        /*
           ล้างฟอร์ม
        */
        document
            .getElementById(
                'createAmount'
            )
            .value = '';


        document
            .getElementById(
                'createCustomer'
            )
            .value = '';


        document
            .getElementById(
                'createOrder'
            )
            .value = '';


        /*
           โหลดรายการใหม่
        */
        loadPayments();


    } catch (error) {

        console.error(
            'createPayment error:',
            error
        );


        alert(
            error.message
        );

    }
}


/* =====================================================
   LOAD PAYMENTS
   ===================================================== */

async function loadPayments() {

    const filter =
        document.getElementById(
            'statusFilter'
        );


    const status =
        filter
            ? filter.value
            : '';


    let url =
        `${API}/admin/payments?limit=100`;


    if (status) {

        url +=
            `&status=${encodeURIComponent(status)}`;

    }


    try {

        const result =
            await apiFetch(
                url
            );


        renderPayments(
            result.payments || []
        );


    } catch (error) {

        console.error(
            'loadPayments error:',
            error
        );


        alert(
            error.message
        );

    }
}


/* =====================================================
   RENDER PAYMENTS
   ===================================================== */

function renderPayments(
    payments
) {

    const table =
        document.getElementById(
            'paymentTable'
        );


    if (!payments.length) {

        table.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="p-8
                           text-center
                           text-gray-400"
                >
                    ไม่พบรายการชำระเงิน
                </td>

            </tr>

        `;

        return;
    }


    table.innerHTML =
        payments
            .map(
                paymentRow
            )
            .join('');
}


/* =====================================================
   PAYMENT ROW
   ===================================================== */

function paymentRow(
    payment
) {

    const status =
        payment.status;


    let statusText =
        status || '-';


    let statusClass =
        'bg-gray-100 text-gray-600';


    if (
        status === 'pending'
    ) {

        statusText =
            'รอชำระ';

        statusClass =
            'bg-yellow-100 text-yellow-700';

    }


    if (
        status === 'paid'
    ) {

        statusText =
            'ชำระแล้ว';

        statusClass =
            'bg-green-100 text-green-700';

    }


    if (
        status === 'cancelled'
    ) {

        statusText =
            'ยกเลิก';

        statusClass =
            'bg-red-100 text-red-700';

    }


    if (
        status === 'expired'
    ) {

        statusText =
            'หมดอายุ';

        statusClass =
            'bg-gray-100 text-gray-500';

    }


    const paymentId =
        payment.id || '';


    const customerUrl =
        `/pay/${encodeURIComponent(paymentId)}`;


    return `

        <tr
            class="border-t
                   border-pink-50
                   hover:bg-pink-50/40"
        >

            <!-- ID -->
            <td class="p-4">

                <div
                    class="font-bold
                           text-pink-500"
                >
                    ${escapeHtml(paymentId)}
                </div>


                <a
                    href="${customerUrl}"
                    target="_blank"
                    rel="noopener"
                    class="text-xs
                           text-gray-400
                           underline"
                >
                    เปิดหน้าลูกค้า
                </a>

            </td>


            <!-- CUSTOMER -->
            <td class="p-4">

                <div class="font-medium">

                    ${escapeHtml(
                        payment.customer_name ||
                        '-'
                    )}

                </div>


                <div
                    class="text-xs
                           text-gray-400"
                >

                    ${escapeHtml(
                        payment.order_detail ||
                        '-'
                    )}

                </div>

            </td>


            <!-- AMOUNT -->
            <td class="p-4 font-bold">

                ฿${Number(
                    payment.amount || 0
                ).toLocaleString(
                    'th-TH',
                    {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }
                )}

            </td>


            <!-- STATUS -->
            <td class="p-4">

                <span
                    class="inline-block
                           px-3 py-1
                           rounded-full
                           text-xs
                           font-medium
                           ${statusClass}"
                >
                    ${statusText}
                </span>

            </td>


            <!-- EXPIRE -->
            <td class="p-4 text-xs">

                ${formatDate(
                    payment.expires_at
                )}

            </td>


            <!-- ACTIONS -->
            <td class="p-4">

                <div
                    class="flex
                           justify-end
                           gap-2
                           flex-wrap"
                >

                    ${
                        status === 'pending'
                        ? `

                            <button
                                onclick="markPaid('${escapeJs(paymentId)}')"
                                class="bg-green-500
                                       hover:bg-green-600
                                       text-white
                                       px-3 py-1.5
                                       rounded-lg
                                       text-xs"
                            >
                                จ่ายแล้ว
                            </button>


                            <button
                                onclick="cancelPayment('${escapeJs(paymentId)}')"
                                class="bg-red-500
                                       hover:bg-red-600
                                       text-white
                                       px-3 py-1.5
                                       rounded-lg
                                       text-xs"
                            >
                                ยกเลิก
                            </button>

                        `
                        : ''
                    }


                    <button
                        onclick="openEdit('${escapeJs(paymentId)}')"
                        class="bg-pink-500
                               hover:bg-pink-600
                               text-white
                               px-3 py-1.5
                               rounded-lg
                               text-xs"
                    >
                        แก้ไข
                    </button>

                </div>

            </td>

        </tr>

    `;
}


/* =====================================================
   MARK PAID
   ===================================================== */

async function markPaid(
    id
) {

    if (
        !confirm(
            `ยืนยันว่า ${id} ได้รับเงินแล้ว?`
        )
    ) {

        return;
    }


    try {

        await apiFetch(
            `${API}/admin/payments/${encodeURIComponent(id)}/paid`,
            {
                method: 'PATCH'
            }
        );


        await loadPayments();


    } catch (error) {

        alert(
            error.message
        );

    }
}


/* =====================================================
   CANCEL PAYMENT
   ===================================================== */

async function cancelPayment(
    id
) {

    if (
        !confirm(
            `ยืนยันยกเลิก ${id}?`
        )
    ) {

        return;
    }


    try {

        await apiFetch(
            `${API}/admin/payments/${encodeURIComponent(id)}/cancel`,
            {
                method: 'PATCH'
            }
        );


        await loadPayments();


    } catch (error) {

        alert(
            error.message
        );

    }
}


/* =====================================================
   OPEN EDIT
   ===================================================== */

async function openEdit(
    id
) {

    try {

        const result =
            await apiFetch(
                `${API}/admin/payments/${encodeURIComponent(id)}`
            );


        const payment =
            result.payment;


        if (!payment) {

            throw new Error(
                'ไม่พบรายการนี้'
            );

        }


        document
            .getElementById(
                'editId'
            )
            .value =
            payment.id || '';


        document
            .getElementById(
                'editAmount'
            )
            .value =
            payment.amount || '';


        document
            .getElementById(
                'editCustomer'
            )
            .value =
            payment.customer_name || '';


        document
            .getElementById(
                'editOrder'
            )
            .value =
            payment.order_detail || '';


        const modal =
            document.getElementById(
                'editModal'
            );


        modal.classList.remove(
            'hidden'
        );


        modal.classList.add(
            'flex'
        );


    } catch (error) {

        alert(
            error.message
        );

    }
}


/* =====================================================
   CLOSE EDIT
   ===================================================== */

function closeEdit() {

    const modal =
        document.getElementById(
            'editModal'
        );


    modal.classList.add(
        'hidden'
    );


    modal.classList.remove(
        'flex'
    );

}


/* =====================================================
   SAVE EDIT
   ===================================================== */

async function saveEdit() {

    const id =
        document
            .getElementById(
                'editId'
            )
            .value;


    const amount =
        Number(
            document
                .getElementById(
                    'editAmount'
                )
                .value
        );


    const customerName =
        document
            .getElementById(
                'editCustomer'
            )
            .value
            .trim();


    const orderDetail =
        document
            .getElementById(
                'editOrder'
            )
            .value
            .trim();


    if (
        !id
    ) {

        alert(
            'ไม่พบ Payment ID'
        );

        return;
    }


    if (
        !Number.isFinite(amount) ||
        amount <= 0
    ) {

        alert(
            'กรุณาระบุยอดเงินให้ถูกต้อง'
        );

        return;
    }


    try {

        await apiFetch(
            `${API}/admin/payments/${encodeURIComponent(id)}`,
            {
                method: 'PATCH',

                body:
                    JSON.stringify({

                        amount,

                        customerName,

                        orderDetail

                    })
            }
        );


        closeEdit();


        await loadPayments();


    } catch (error) {

        alert(
            error.message
        );

    }
}


/* =====================================================
   COPY
   ===================================================== */

async function copyValue(
    value
) {

    try {

        if (
            navigator.clipboard &&
            window.isSecureContext
        ) {

            await navigator.clipboard.writeText(
                value
            );

        } else {

            const textarea =
                document.createElement(
                    'textarea'
                );


            textarea.value =
                value;


            textarea.style.position =
                'fixed';


            textarea.style.opacity =
                '0';


            document.body.appendChild(
                textarea
            );


            textarea.focus();


            textarea.select();


            document.execCommand(
                'copy'
            );


            textarea.remove();

        }


        alert(
            'คัดลอกลิงก์แล้ว'
        );


    } catch (error) {

        console.error(
            'copy error:',
            error
        );


        alert(
            'ไม่สามารถคัดลอกได้'
        );

    }
}


/* =====================================================
   DATE
   ===================================================== */

function formatDate(
    value
) {

    if (!value) {

        return '-';

    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return '-';

    }


    return date.toLocaleString(
        'th-TH',
        {
            dateStyle: 'short',
            timeStyle: 'short'
        }
    );
}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHtml(
    value
) {

    return String(
        value ?? ''
    )

        .replace(
            /&/g,
            '&amp;'
        )

        .replace(
            /</g,
            '&lt;'
        )

        .replace(
            />/g,
            '&gt;'
        )

        .replace(
            /"/g,
            '&quot;'
        )

        .replace(
            /'/g,
            '&#039;'
        );
}


/* =====================================================
   ESCAPE JAVASCRIPT STRING
   ===================================================== */

function escapeJs(
    value
) {

    return String(
        value ?? ''
    )

        .replace(
            /\\/g,
            '\\\\'
        )

        .replace(
            /'/g,
            "\\'"
        )

        .replace(
            /"/g,
            '\\"'
        )

        .replace(
            /\r/g,
            '\\r'
        )

        .replace(
            /\n/g,
            '\\n'
        );
}
