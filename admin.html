<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinkjulieland Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link
    href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
>
<style>
    body {
        font-family: 'Prompt', sans-serif;
        background:
            linear-gradient(
                135deg,
                #fff9fb 0%,
                #fcecf2 100%
            );
        min-height: 100vh;
    }
    .glass {
        background: rgba(255,255,255,.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255,255,255,.9);
        box-shadow:
            0 20px 50px -10px rgba(244,114,182,.15);
    }
</style>
</head>
<body class="text-gray-700">
<div class="max-w-6xl mx-auto px-4 py-6">
<!-- HEADER -->
<div class="flex flex-col md:flex-row
            md:items-center md:justify-between
            gap-4 mb-6">
    <div>
        <h1 class="text-2xl font-bold text-pink-500">
            Pinkjulieland Admin
        </h1>
        <p class="text-sm text-gray-500">
            จัดการรายการชำระเงิน
        </p>
    </div>
    <button
        onclick="logout()"
        class="bg-gray-800 text-white
               px-5 py-2.5 rounded-xl
               text-sm font-medium">
        ออกจากระบบ
    </button>
</div>
<!-- LOGIN -->
<div
    id="loginPanel"
    class="max-w-md mx-auto glass
           rounded-3xl p-6">
    <h2 class="text-lg font-bold mb-2">
        เข้าสู่ระบบแอดมิน
    </h2>
    <p class="text-sm text-gray-500 mb-5">
        กรุณาใส่ Admin API Key
    </p>
    <input
        id="apiKeyInput"
        type="password"
        placeholder="Admin API Key"
        class="w-full border border-pink-100
               rounded-xl px-4 py-3
               outline-none focus:ring-2
               focus:ring-pink-300"
    >
    <button
        onclick="login()"
        class="w-full mt-4
               bg-pink-500 hover:bg-pink-600
               text-white font-semibold
               py-3 rounded-xl">
        เข้าสู่ระบบ
    </button>
    <div
        id="loginError"
        class="text-red-500 text-sm mt-3 hidden">
    </div>
</div>
<!-- ADMIN APP -->
<div
    id="adminPanel"
    class="hidden">
    <!-- CREATE PAYMENT -->
    <div class="glass rounded-3xl p-6 mb-6">
        <div class="flex items-center
                    justify-between mb-5">
            <div>
                <h2 class="text-lg font-bold">
                    สร้างรายการชำระเงิน
                </h2>
                <p class="text-xs text-gray-500">
                    สร้างลิงก์ส่งให้ลูกค้า
                </p>
            </div>
        </div>
        <div class="grid md:grid-cols-2 gap-4">
            <div>
                <label class="text-sm font-medium">
                    ยอดเงิน
                </label>
                <input
                    id="createAmount"
                    type="number"
                    min="0.01"
                    step="0.01"
                    placeholder="599"
                    class="mt-1 w-full border
                           border-pink-100
                           rounded-xl px-4 py-3"
                >
            </div>
            <div>
                <label class="text-sm font-medium">
                    ชื่อลูกค้า
                </label>
                <input
                    id="createCustomer"
                    type="text"
                    placeholder="น้องพลอย"
                    class="mt-1 w-full border
                           border-pink-100
                           rounded-xl px-4 py-3"
                >
            </div>
            <div>
                <label class="text-sm font-medium">
                    รายละเอียดออเดอร์
                </label>
                <input
                    id="createOrder"
                    type="text"
                    placeholder="ค่ามัดจำสินค้า"
                    class="mt-1 w-full border
                           border-pink-100
                           rounded-xl px-4 py-3"
                >
            </div>
            <div>
                <label class="text-sm font-medium">
                    อายุลิงก์ (นาที)
                </label>
                <input
                    id="createExpire"
                    type="number"
                    value="60"
                    min="5"
                    max="10080"
                    class="mt-1 w-full border
                           border-pink-100
                           rounded-xl px-4 py-3"
                >
            </div>
        </div>
        <button
            onclick="createPayment()"
            class="mt-5 bg-pink-500
                   hover:bg-pink-600
                   text-white font-semibold
                   px-6 py-3 rounded-xl">
            + สร้างรายการ
        </button>
        <div
            id="createResult"
            class="hidden mt-5
                   bg-pink-50
                   border border-pink-200
                   rounded-2xl p-4">
        </div>
    </div>
    <!-- FILTER -->
    <div class="glass rounded-3xl p-5 mb-6">
        <div class="flex flex-col md:flex-row
                    md:items-center
                    md:justify-between gap-3">
            <div>
                <h2 class="font-bold">
                    รายการชำระเงิน
                </h2>
            </div>
            <div class="flex gap-2">
                <select
                    id="statusFilter"
                    onchange="loadPayments()"
                    class="border border-pink-100
                           rounded-xl px-4 py-2">
                    <option value="">
                        ทั้งหมด
                    </option>
                    <option value="pending">
                        รอชำระ
                    </option>
                    <option value="paid">
                        ชำระแล้ว
                    </option>
                    <option value="cancelled">
                        ยกเลิก
                    </option>
                    <option value="expired">
                        หมดอายุ
                    </option>
                </select>
                <button
                    onclick="loadPayments()"
                    class="bg-gray-800
                           text-white
                           px-4 py-2
                           rounded-xl">
                    รีเฟรช
                </button>
            </div>
        </div>
    </div>
    <!-- TABLE -->
    <div class="glass rounded-3xl
                overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead class="bg-pink-50">
                    <tr>
                        <th class="text-left p-4">
                            Payment ID
                        </th>
                        <th class="text-left p-4">
                            ลูกค้า
                        </th>
                        <th class="text-left p-4">
                            ยอด
                        </th>
                        <th class="text-left p-4">
                            สถานะ
                        </th>
                        <th class="text-left p-4">
                            หมดอายุ
                        </th>
                        <th class="text-right p-4">
                            จัดการ
                        </th>
                    </tr>
                </thead>
                <tbody id="paymentTable">
                </tbody>
            </table>
        </div>
    </div>
</div>
</div>
<!-- EDIT MODAL -->
<div
    id="editModal"
    class="fixed inset-0 bg-black/40
           hidden items-center justify-center
           p-4 z-50">
<div class="bg-white
            rounded-3xl
            max-w-lg
            w-full
            p-6">
    <div class="flex justify-between
                items-center mb-5">
        <h2 class="font-bold text-lg">
            แก้ไขรายการ
        </h2>
        <button
            onclick="closeEdit()"
            class="text-gray-400
                   text-xl">
            ×
        </button>
    </div>
    <input
        id="editId"
        type="hidden"
    >
    <label class="text-sm">
        ยอดเงิน
    </label>
    <input
        id="editAmount"
        type="number"
        step="0.01"
        class="w-full border
               rounded-xl px-4 py-3
               mt-1 mb-4"
    >
    <label class="text-sm">
        ชื่อลูกค้า
    </label>
    <input
        id="editCustomer"
        type="text"
        class="w-full border
               rounded-xl px-4 py-3
               mt-1 mb-4"
    >
    <label class="text-sm">
        รายละเอียด
    </label>
    <input
        id="editOrder"
        type="text"
        class="w-full border
               rounded-xl px-4 py-3
               mt-1 mb-5"
    >
    <div class="flex gap-2">
        <button
            onclick="saveEdit()"
            class="flex-1 bg-pink-500
                   text-white
                   py-3 rounded-xl
                   font-semibold">
            บันทึก
        </button>
        <button
            onclick="closeEdit()"
            class="px-5 bg-gray-100
                   rounded-xl">
            ยกเลิก
        </button>
    </div>
</div>
</div>
<script>
const API =
    '/api';
let API_KEY =
    localStorage.getItem(
        'pinkjulie_admin_key'
    );
/* =====================================================
   LOGIN
   ===================================================== */
function login() {
    const key =
        document
            .getElementById('apiKeyInput')
            .value
            .trim();
    if (!key) {
        showLoginError(
            'กรุณาใส่ API Key'
        );
        return;
    }
    API_KEY =
        key;
    localStorage.setItem(
        'pinkjulie_admin_key',
        key
    );
    verifyLogin();
}
async function verifyLogin() {
    try {
        const response =
            await fetch(
                `${API}/admin/payments?limit=1`,
                {
                    headers: {
                        'X-API-Key':
                            API_KEY
                    }
                }
            );
        if (!response.ok) {
            throw new Error(
                'Invalid API Key'
            );
        }
        document
            .getElementById('loginPanel')
            .classList.add('hidden');
        document
            .getElementById('adminPanel')
            .classList.remove('hidden');
        loadPayments();
    } catch (error) {
        localStorage.removeItem(
            'pinkjulie_admin_key'
        );
        API_KEY =
            null;
        showLoginError(
            'API Key ไม่ถูกต้อง'
        );
    }
}
function showLoginError(
    message
) {
    const el =
        document.getElementById(
            'loginError'
        );
    el.textContent =
        message;
    el.classList.remove(
        'hidden'
    );
}
/* =====================================================
   LOGOUT
   ===================================================== */
function logout() {
    localStorage.removeItem(
        'pinkjulie_admin_key'
    );
    API_KEY =
        null;
    location.reload();
}
/* =====================================================
   FETCH HELPER
   ===================================================== */
async function apiFetch(
    url,
    options = {}
) {
    const response =
        await fetch(
            url,
            {
                ...options,
                headers: {
                    ...(options.headers || {}),
                    'X-API-Key':
                        API_KEY,
                    'Content-Type':
                        'application/json'
                }
            }
        );
    if (
        response.status === 401 ||
        response.status === 403
    ) {
        logout();
        throw new Error(
            'Unauthorized'
        );
    }
    const data =
        await response.json()
            .catch(
                () => ({})
            );
    if (!response.ok) {
        throw new Error(
            data.error ||
            'เกิดข้อผิดพลาด'
        );
    }
    return data;
}
/* =====================================================
   CREATE PAYMENT
   ===================================================== */
async function createPayment() {
    const amount =
        document
            .getElementById(
                'createAmount'
            )
            .value;
    const customerName =
        document
            .getElementById(
                'createCustomer'
            )
            .value;
    const orderDetail =
        document
            .getElementById(
                'createOrder'
            )
            .value;
    const expiresInMinutes =
        document
            .getElementById(
                'createExpire'
            )
            .value;
    if (!amount) {
        alert(
            'กรุณาใส่ยอดเงิน'
        );
        return;
    }
    try {
        const result =
            await apiFetch(
                `${API}/admin/payments`,
                {
                    method:
                        'POST',
                    body:
                        JSON.stringify({
                            amount:
                                Number(
                                    amount
                                ),
                            customerName,
                            orderDetail,
                            expiresInMinutes:
                                Number(
                                    expiresInMinutes
                                )
                        })
                }
            );
        const payment =
            result.payment;
        const url =
            `${location.origin}/pay/${payment.id}`;
        const resultBox =
            document
                .getElementById(
                    'createResult'
                );
        resultBox.innerHTML = `
            <div class="font-bold
                        text-pink-500
                        mb-2">
                สร้างรายการสำเร็จ
            </div>
            <div class="text-sm mb-2">
                Payment ID:
                <b>${escapeHtml(payment.id)}</b>
            </div>
            <div class="flex gap-2">
                <input
                    value="${url}"
                    readonly
                    class="flex-1 border
                           rounded-xl px-3 py-2
                           text-xs"
                >
                <button
                    onclick="copyValue('${url}')"
                    class="bg-pink-500
                           text-white
                           px-4 rounded-xl">
                    คัดลอก
                </button>
            </div>
        `;
        resultBox.classList.remove(
            'hidden'
        );
        document
            .getElementById(
                'createAmount'
            )
            .value = '';
        document
            .getElementById(
                'createCustomer'
            )
            .value = '';
        document
            .getElementById(
                'createOrder'
            )
            .value = '';
        loadPayments();
    } catch (error) {
        alert(
            error.message
        );
    }
}
/* =====================================================
   LOAD PAYMENTS
   ===================================================== */
async function loadPayments() {
    const status =
        document
            .getElementById(
                'statusFilter'
            )
            .value;
    let url =
        `${API}/admin/payments?limit=100`;
    if (status) {
        url +=
            `&status=${encodeURIComponent(status)}`;
    }
    try {
        const result =
            await apiFetch(
                url
            );
        renderPayments(
            result.payments
        );
    } catch (error) {
        alert(
            error.message
        );
    }
}
/* =====================================================
   RENDER
   ===================================================== */
function renderPayments(
    payments
) {
    const table =
        document.getElementById(
            'paymentTable'
        );
    if (!payments.length) {
        table.innerHTML = `
            <tr>
                <td
                    colspan="6"
                    class="p-8
                           text-center
                           text-gray-400">
                    ไม่พบรายการ
                </td>
            </tr>
        `;
        return;
    }
    table.innerHTML =
        payments
            .map(
                paymentRow
            )
            .join('');
}
function paymentRow(
    payment
) {
    const status =
        payment.status;
    let statusText =
        status;
    let statusClass =
        'bg-gray-100 text-gray-600';
    if (
        status === 'pending'
    ) {
        statusText =
            'รอชำระ';
        statusClass =
            'bg-yellow-100 text-yellow-700';
    }
    if (
        status === 'paid'
    ) {
        statusText =
            'ชำระแล้ว';
        statusClass =
            'bg-green-100 text-green-700';
    }
    if (
        status === 'cancelled'
    ) {
        statusText =
            'ยกเลิก';
        statusClass =
            'bg-red-100 text-red-700';
    }
    if (
        status === 'expired'
    ) {
        statusText =
            'หมดอายุ';
        statusClass =
            'bg-gray-100 text-gray-500';
    }
    return `
        <tr
            class="border-t
                   border-pink-50">
            <td class="p-4">
                <div class="font-bold
                            text-pink-500">
                    ${escapeHtml(
                        payment.id
                    )}
                </div>
                <a
                    href="/pay/${encodeURIComponent(payment.id)}"
                    target="_blank"
                    class="text-xs
                           text-gray-400
                           underline">
                    เปิดหน้าลูกค้า
                </a>
            </td>
            <td class="p-4">
                <div class="font-medium">
                    ${escapeHtml(
                        payment.customer_name ||
                        '-'
                    )}
                </div>
                <div class="text-xs
                            text-gray-400">
                    ${escapeHtml(
                        payment.order_detail ||
                        '-'
                    )}
                </div>
            </td>
            <td class="p-4 font-bold">
                ฿${Number(
                    payment.amount
                ).toLocaleString(
                    'th-TH',
                    {
                        minimumFractionDigits: 2
                    }
                )}
            </td>
            <td class="p-4">
                <span
                    class="inline-block
                           px-3 py-1
                           rounded-full
                           text-xs
                           font-medium
                           ${statusClass}">
                    ${statusText}
                </span>
            </td>
            <td class="p-4 text-xs">
                ${formatDate(
                    payment.expires_at
                )}
            </td>
            <td class="p-4">
                <div class="flex
                            justify-end
                            gap-2
                            flex-wrap">
                    ${
                        status === 'pending'
                        ? `
                        <button
                            onclick="markPaid('${payment.id}')"
                            class="bg-green-500
                                   text-white
                                   px-3 py-1.5
                                   rounded-lg
                                   text-xs">
                            จ่ายแล้ว
                        </button>
                        <button
                            onclick="cancelPayment('${payment.id}')"
                            class="bg-red-500
                                   text-white
                                   px-3 py-1.5
                                   rounded-lg
                                   text-xs">
                            ยกเลิก
                        </button>
                        `
                        : ''
                    }
                    <button
                        onclick="openEdit('${payment.id}')"
                        class="bg-pink-500
                               text-white
                               px-3 py-1.5
                               rounded-lg
                               text-xs">
                        แก้ไข
                    </button>
                </div>
            </td>
        </tr>
    `;
}
/* =====================================================
   MARK PAID
   ===================================================== */
async function markPaid(
    id
) {
    if (
        !confirm(
            `ยืนยันว่า ${id} ได้รับเงินแล้ว?`
        )
    ) {
        return;
    }
    try {
        await apiFetch(
            `${API}/admin/payments/${id}/paid`,
            {
                method:
                    'PATCH'
            }
        );
        loadPayments();
    } catch (error) {
        alert(
            error.message
        );
    }
}
/* =====================================================
   CANCEL
   ===================================================== */
async function cancelPayment(
    id
) {
    if (
        !confirm(
            `ยืนยันยกเลิก ${id}?`
        )
    ) {
        return;
    }
    try {
        await apiFetch(
            `${API}/admin/payments/${id}/cancel`,
            {
                method:
                    'PATCH'
            }
        );
        loadPayments();
    } catch (error) {
        alert(
            error.message
        );
    }
}
/* =====================================================
   EDIT
   ===================================================== */
async function openEdit(
    id
) {
    try {
        const result =
            await apiFetch(
                `${API}/admin/payments/${id}`
            );
        const payment =
            result.payment;
        document
            .getElementById(
                'editId'
            )
            .value =
            payment.id;
        document
            .getElementById(
                'editAmount'
            )
            .value =
            payment.amount;
        document
            .getElementById(
                'editCustomer'
            )
            .value =
            payment.customer_name ||
            '';
        document
            .getElementById(
                'editOrder'
            )
            .value =
            payment.order_detail ||
            '';
        const modal =
            document.getElementById(
                'editModal'
            );
        modal.classList.remove(
            'hidden'
        );
        modal.classList.add(
            'flex'
        );
    } catch (error) {
        alert(
            error.message
        );
    }
}
function closeEdit() {
    const modal =
        document.getElementById(
            'editModal'
        );
    modal.classList.add(
        'hidden'
    );
    modal.classList.remove(
        'flex'
    );
}
/* =====================================================
   SAVE EDIT
   ===================================================== */
async function saveEdit() {
    const id =
        document
            .getElementById(
                'editId'
            )
            .value;
    const amount =
        Number(
            document
                .getElementById(
                    'editAmount'
                )
                .value
        );
    const customerName =
        document
            .getElementById(
                'editCustomer'
            )
            .value;
    const orderDetail =
        document
            .getElementById(
                'editOrder'
            )
            .value;
    if (
        !amount ||
        amount <= 0
    ) {
        alert(
            'กรุณาระบุยอดเงิน'
        );
        return;
    }
    try {
        await apiFetch(
            `${API}/admin/payments/${id}`,
            {
                method:
                    'PATCH',
                body:
                    JSON.stringify({
                        amount,
                        customerName,
                        orderDetail
                    })
            }
        );
        closeEdit();
        loadPayments();
    } catch (error) {
        alert(
            error.message
        );
    }
}
/* =====================================================
   COPY
   ===================================================== */
async function copyValue(
    value
) {
    try {
        await navigator.clipboard.writeText(
            value
        );
        alert(
            'คัดลอกแล้ว'
        );
    } catch {
        alert(
            'ไม่สามารถคัดลอกได้'
        );
    }
}
/* =====================================================
   DATE
   ===================================================== */
function formatDate(
    value
) {
    if (!value) {
        return '-';
    }
    const date =
        new Date(value);
    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return '-';
    }
    return date.toLocaleString(
        'th-TH',
        {
            dateStyle:
                'short',
            timeStyle:
                'short'
        }
    );
}
/* =====================================================
   ESCAPE HTML
   ===================================================== */
function escapeHtml(
    value
) {
    return String(
        value ?? ''
    )
    .replace(
        /&/g,
        '&amp;'
    )
    .replace(
        /</g,
        '&lt;'
    )
    .replace(
        />/g,
        '&gt;'
    )
    .replace(
        /"/g,
        '&quot;'
    )
    .replace(
        /'/g,
        '&#039;'
    );
}
/* =====================================================
   AUTO LOGIN
   ===================================================== */
if (API_KEY) {
    verifyLogin();
}
</script>
</body>
</html>
